<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สถานีโดรน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
<style>
:root{--bg:#f1f5ee;--card:#fff;--ink:#1d2a22;--mute:#5d6e63;--line:#dbe4d6;--g:#2c7a4b;--gb:#e1f0e5;--r:#b3342b;--rb:#f9e4e1;--y:#f2b705;--hd:#1f4d36;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a14;--card:#1a251e;--ink:#e5eee7;--mute:#92a79a;--line:#2a3a2f;--g:#5fc388;--gb:#1d3a2a;--r:#f28b82;--rb:#3b2220;--hd:#16382a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a14;--card:#1a251e;--ink:#e5eee7;--mute:#92a79a;--line:#2a3a2f;--g:#5fc388;--gb:#1d3a2a;--r:#f28b82;--rb:#3b2220;--hd:#16382a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Prompt,"Noto Sans Thai",system-ui,sans-serif;padding-bottom:96px}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{background:var(--hd);color:#f1f7ee;padding:18px 0 22px;border-radius:0 0 26px 26px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:600}
.brand svg{width:34px;height:34px;color:var(--y)}
#sync{margin-left:auto;font-size:13px;background:rgba(255,255,255,.16);color:inherit;border:0;border-radius:99px;padding:6px 14px;cursor:pointer}
.hero{margin-top:16px;font-size:13px;opacity:.85}
#owed{display:block;font-size:42px;line-height:1.15;font-weight:600;color:var(--y);opacity:1}
.stats{display:flex;gap:22px;margin-top:10px;font-size:12px;opacity:.9}
.stats strong{display:block;font-size:16px;font-weight:500}
.tabs{display:flex;gap:6px;margin:18px 0 10px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:500}
#search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.chips{display:flex;gap:8px;margin:10px 0 4px}
.chips button{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 14px;font-size:13px;cursor:pointer;color:var(--mute)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-weight:500;font-size:16px}
.tag{font-size:12px;padding:1px 10px;border-radius:99px;white-space:nowrap}
.tag.paid{background:var(--gb);color:var(--g)}
.tag.due,.tag.part{background:var(--rb);color:var(--r)}
.meta{font-size:13px;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:9px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.bot{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:13px;color:var(--mute)}
.bot b{color:var(--ink);font-weight:500}
.pay{margin-left:auto;border:1px solid var(--g);color:var(--g);background:none;border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--y);color:#2a2100;border:0;border-radius:99px;padding:14px 22px;font-weight:600;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;padding:0;width:min(100%,520px);background:var(--card);color:var(--ink);border-radius:20px;max-height:94dvh}
dialog::backdrop{background:rgba(0,0,0,.5)}
@media(max-width:600px){dialog{margin:auto 0 0;border-radius:20px 20px 0 0}}
.sheet{padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:18px;font-weight:600}
.fld{display:block;margin-bottom:10px;font-size:13px;color:var(--mute)}
.fld input{display:block;width:100%;margin-top:3px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.payrow{display:flex;gap:8px}
.payrow button{white-space:nowrap;margin-top:3px;border:1px solid var(--g);color:var(--g);background:none;border-radius:10px;padding:0 14px;cursor:pointer}
.sum{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;margin:4px 0 14px}
.sum b{font-weight:600}
.acts{display:flex;gap:8px}
.acts button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer}
.acts .primary{flex:2;background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.acts .danger{color:var(--r);flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:14px;display:none;z-index:99}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand">
<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="15" y="16" width="10" height="8" rx="3" fill="currentColor"/><path d="M15 17 8 10M25 17l7-7M15 23l-7 7M25 23l7 7"/><path d="M3 10h10M27 10h10M3 30h10M27 30h10"/></svg>
<h1>สถานีโดรน</h1><button id="sync" type="button">คัดลอกลิงก์</button></div>
<div class="hero">ยอดค้างรับทั้งหมด<b id="owed">฿0</b></div>
<div class="stats"><div>ยอดรวมงาน<strong id="tot">฿0</strong></div><div>รับแล้ว<strong id="got">฿0</strong></div><div>จำนวนไร่<strong id="rai">0</strong></div></div>
</div></header>

<main class="wrap">
<div class="tabs"><button id="t-jobs" class="on">รายการบัญชี</button><button id="t-cust">ลูกค้า</button></div>
<div id="tools"><input id="search" type="search" placeholder="ค้นหาชื่อลูกค้า">
<div class="chips"><button data-f="all" class="on">ทั้งหมด</button><button data-f="due">ค้างชำระ</button><button data-f="paid">ชำระแล้ว</button></div></div>
<div id="view"></div>
</main>
<button class="fab" id="add">+ เพิ่มรายการ</button>
<div id="toast"></div>

<dialog id="dlg"><div class="sheet">
<h2 id="dt">เพิ่มรายการ</h2>
<label class="fld">ชื่อลูกค้า<input id="f-c" list="cl" autocomplete="off" placeholder="เช่น ลุงสมชาย"></label>
<datalist id="cl"></datalist>
<div class="two">
<label class="fld">วันที่<input id="f-d" type="date"></label>
<label class="fld">จำนวนไร่<input id="f-r" type="number" inputmode="decimal" min="0" step="any"></label>
<label class="fld">ราคาต่อไร่ (฿)<input id="f-p" type="number" inputmode="decimal" min="0" step="any"></label>
<label class="fld">ค่าปุ๋ยและยา (฿)<input id="f-i" type="number" inputmode="decimal" min="0" step="any"></label>
</div>
<div class="fld">รับชำระแล้ว (฿)<div class="payrow"><input id="f-s" type="number" inputmode="decimal" min="0" step="any" style="margin-top:3px;flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px"><button type="button" id="full">ชำระครบ</button></div></div>
<label class="fld">หมายเหตุ<input id="f-n" placeholder="เช่น นาข้าว แปลงหลังบ้าน"></label>
<div class="sum" id="sum"></div>
<div class="acts"><button id="del" class="danger">ลบ</button><button id="cancel">ยกเลิก</button><button id="save" class="primary">บันทึก</button></div>
</div></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyC-Cuj78X7t7gTlkIJGvY0GQn0zleekMcs",authDomain:"dronestation-b2c38.firebaseapp.com",projectId:"dronestation-b2c38",storageBucket:"dronestation-b2c38.firebasestorage.app",messagingSenderId:"367924185661",appId:"1:367924185661:web:85ecee8fe2105e3cfab854"};

// รหัสสมุดบัญชี: อยู่ท้ายลิงก์ (#...) ใครมีลิงก์เต็มก็เปิดสมุดเดียวกันได้
const OK=/^[A-Za-z0-9]{20,}$/;
let FRESH=false;
const BOOK=(()=>{
  let h=location.hash.slice(1);
  if(!OK.test(h)){
    try{h=localStorage.getItem('dronestation.book')||''}catch(e){h=''}
    if(!OK.test(h)){h=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>(b%36).toString(36)).join('');FRESH=true}
  }
  try{localStorage.setItem('dronestation.book',h)}catch(e){}
  history.replaceState(null,'','#'+h);
  return h;
})();
const $=s=>document.querySelector(s);
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=j=>(+j.rai||0)*(+j.price||0)+(+j.inputs||0);
const owed=j=>Math.max(0,total(j)-(+j.paid||0));
const dateTH=d=>d?new Date(d+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let jobs=[],ready=false,db=null,tab='jobs',filter='all',q='',editId=null,delArm=false;
const LS='dronestation.jobs';

function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',ms||2600)}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(jobs))}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}

async function put(j){
  const i=jobs.findIndex(x=>x.id===j.id);i<0?jobs.push(j):jobs[i]=j;
  if(db){try{await setDoc(doc(db,'books',BOOK,'jobs',j.id),j)}catch(e){toast('บันทึกไม่สำเร็จ ลองอีกครั้ง')}}else saveLocal();
  render();
}
async function del(id){
  jobs=jobs.filter(x=>x.id!==id);
  if(db){try{await deleteDoc(doc(db,'books',BOOK,'jobs',id))}catch(e){toast('ลบไม่สำเร็จ ลองอีกครั้ง')}}else saveLocal();
  render();
}

const row=j=>{
  const t=total(j),p=+j.paid||0,o=owed(j),s=o===0?'paid':p>0?'part':'due',pc=t?Math.min(100,p/t*100):100;
  return `<article class="row" data-id="${j.id}"><div class="top"><b>${esc(j.customer)}</b><span class="tag ${s}">${s==='paid'?'ชำระแล้ว':s==='part'?'ค้างบางส่วน':'ยังไม่ชำระ'}</span></div>
<div class="meta">${dateTH(j.date)}  ${fmt(j.rai)} ไร่ × ฿${fmt(j.price)} + ปุ๋ย/ยา ฿${fmt(j.inputs)}</div>${j.note?`<div class="meta">${esc(j.note)}</div>`:''}
<div class="bar"><i style="width:${pc}%"></i></div>
<div class="bot"><span>รวม <b>฿${fmt(t)}</b></span><span>รับแล้ว <b>฿${fmt(p)}</b></span>${o?`<button class="pay" data-pay="${j.id}">ชำระครบ ฿${fmt(o)}</button>`:''}</div></article>`;
};

function listHTML(){
  const L=jobs.filter(j=>(filter==='all'||(filter==='due'?owed(j)>0:owed(j)===0))&&(!q||(j.customer||'').toLowerCase().includes(q.toLowerCase())))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));
  if(!L.length)return `<p class="empty">${jobs.length?'ไม่พบรายการที่ตรงกัน':'ยังไม่มีรายการ กด “เพิ่มรายการ” เพื่อบันทึกงานแรก'}</p>`;
  return L.map(row).join('');
}
function custHTML(){
  const m={};
  jobs.forEach(j=>{const k=(j.customer||'').trim();const x=m[k]||(m[k]={n:k,c:0,r:0,t:0,p:0,o:0});x.c++;x.r+=+j.rai||0;x.t+=total(j);x.p+=+j.paid||0;x.o+=owed(j)});
  const A=Object.values(m).sort((a,b)=>b.o-a.o||b.t-a.t);
  if(!A.length)return '<p class="empty">ยังไม่มีลูกค้า</p>';
  return A.map(x=>`<article class="row" data-cust="${esc(x.n)}"><div class="top"><b>${esc(x.n)}</b><span class="tag ${x.o?'due':'paid'}">${x.o?'ค้าง ฿'+fmt(x.o):'ไม่มียอดค้าง'}</span></div>
<div class="meta">${x.c} งาน  ${fmt(x.r)} ไร่</div><div class="bot"><span>รวม <b>฿${fmt(x.t)}</b></span><span>รับแล้ว <b>฿${fmt(x.p)}</b></span></div></article>`).join('');
}

function render(){
  const T=jobs.reduce((a,j)=>a+total(j),0),P=jobs.reduce((a,j)=>a+(+j.paid||0),0),O=jobs.reduce((a,j)=>a+owed(j),0),R=jobs.reduce((a,j)=>a+(+j.rai||0),0);
  $('#owed').textContent='฿'+fmt(O);$('#tot').textContent='฿'+fmt(T);$('#got').textContent='฿'+fmt(P);$('#rai').textContent=fmt(R);
  $('#sync').style.display=ready?'':'none';
  $('#t-jobs').classList.toggle('on',tab==='jobs');$('#t-cust').classList.toggle('on',tab==='cust');
  $('#tools').style.display=tab==='jobs'?'':'none';
  document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b.dataset.f===filter));
  $('#view').innerHTML=!ready?'<p class="empty">กำลังโหลดข้อมูล…</p>':tab==='jobs'?listHTML():custHTML();
}

function calc(){
  const r=+$('#f-r').value||0,p=+$('#f-p').value||0,i=+$('#f-i').value||0,s=+$('#f-s').value||0,t=r*p+i,o=t-s;
  $('#sum').innerHTML=`ค่าพ่น ฿${fmt(r*p)} + ปุ๋ย/ยา ฿${fmt(i)} = รวม <b>฿${fmt(t)}</b><br>`+(o>0?`คงค้าง <b style="color:var(--r)">฿${fmt(o)}</b>`:`<b style="color:var(--g)">ชำระครบแล้ว</b>${o<0?' (รับเกิน ฿'+fmt(-o)+')':''}`);
}
function openForm(id){
  editId=id;delArm=false;$('#del').textContent='ลบ';
  const j=id?jobs.find(x=>x.id===id):null,last=[...jobs].sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
  $('#dt').textContent=j?'แก้ไขรายการ':'เพิ่มรายการ';
  $('#f-c').value=j?j.customer:'';$('#f-d').value=j?j.date:today();$('#f-r').value=j?j.rai:'';
  $('#f-p').value=j?j.price:(last?last.price:'');$('#f-i').value=j?j.inputs:'';$('#f-s').value=j?j.paid:'';$('#f-n').value=j?j.note||'':'';
  $('#del').style.display=j?'':'none';
  $('#cl').innerHTML=[...new Set(jobs.map(x=>(x.customer||'').trim()).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('');
  calc();$('#dlg').showModal();
}
['f-r','f-p','f-i','f-s'].forEach(id=>$('#'+id).addEventListener('input',calc));
$('#full').onclick=()=>{$('#f-s').value=(+$('#f-r').value||0)*(+$('#f-p').value||0)+(+$('#f-i').value||0);calc()};
$('#cancel').onclick=()=>$('#dlg').close();
$('#save').onclick=()=>{
  const c=$('#f-c').value.trim(),r=+$('#f-r').value;
  if(!c){toast('กรอกชื่อลูกค้าก่อน');return}
  if(!(r>0)){toast('กรอกจำนวนไร่ให้มากกว่า 0');return}
  put({id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2,6),customer:c,date:$('#f-d').value||today(),rai:r,price:+$('#f-p').value||0,inputs:+$('#f-i').value||0,paid:+$('#f-s').value||0,note:$('#f-n').value.trim(),ts:Date.now()});
  $('#dlg').close();
};
$('#del').onclick=()=>{
  if(!delArm){delArm=true;$('#del').textContent='แตะอีกครั้งเพื่อลบ';return}
  del(editId);$('#dlg').close();
};
$('#add').onclick=()=>openForm(null);
$('#t-jobs').onclick=()=>{tab='jobs';render()};
$('#t-cust').onclick=()=>{tab='cust';render()};
$('#search').oninput=e=>{q=e.target.value.trim();render()};
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
$('#view').onclick=e=>{
  const p=e.target.closest('[data-pay]');
  if(p){const j=jobs.find(x=>x.id===p.dataset.pay);if(j)put({...j,paid:total(j),ts:j.ts});return}
  const r=e.target.closest('[data-id]');if(r){openForm(r.dataset.id);return}
  const c=e.target.closest('[data-cust]');if(c){tab='jobs';filter='all';q=c.dataset.cust;$('#search').value=q;render()}
};

$('#sync').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('คัดลอกลิงก์แล้ว')}catch(e){prompt('คัดลอกลิงก์นี้ไปส่งต่อ',location.href)}};
(async()=>{
  render();
  db=getFirestore(initializeApp(firebaseConfig));
  onSnapshot(collection(db,'books',BOOK,'jobs'),sn=>{jobs=sn.docs.map(d=>({...d.data(),id:d.id}));ready=true;render()},()=>{ready=true;render();toast('โหลดข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วเปิดใหม่',5000)});
  if(FRESH)toast('นี่คือสมุดบัญชีใหม่ กด “คัดลอกลิงก์” เพื่อส่งให้คนที่จะใช้ร่วมกัน',7000);
})();
</script>
</body>
</html>
